name: efortune-site v2

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/efortune-site.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: v2

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SHOW_BG_SWITCHER: 'true'
      - run: npm test
        env:
          SHOW_BG_SWITCHER: 'true'

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SHOW_BG_SWITCHER: 'true'
      - run: npm test
        env:
          SHOW_BG_SWITCHER: 'true'
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EFORTUNE_SITE }}
        run: npx wrangler deploy
